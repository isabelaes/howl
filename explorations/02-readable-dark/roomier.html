<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Roomier, Round 02 Howl exploration." />
    <title>Howl · Round 02 · Roomier</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body class="feed-page size-roomier">
    <div class="app-shell">
      <aside class="left-rail" aria-label="Main navigation">
        <a class="wordmark" href="./">Howl</a>
        <nav class="primary-nav">
          <a class="nav-link" href="#feed" aria-current="page">Home</a>
          <a class="nav-link" href="#about">About</a>
        </nav>
        <button class="write-button" type="button" data-open-compose>Write a post</button>
      </aside>
      <main class="feed-column" id="feed">
        <header class="feed-header">
          <h1>Roomier</h1>
          <button class="mobile-write" type="button" data-open-compose>Write</button>
        </header>
        <div class="feed-tabs" aria-label="Feed">
          <span class="active-tab">For you</span>
          <span>Following</span>
        </div>
        <ol class="post-list" data-post-list aria-label="Campus posts"></ol>
      </main>
      <aside class="right-rail" id="about">
        <h2>About Howl</h2>
        <p>Short posts from NC State students about campus life.</p>
      </aside>
    </div>
    <dialog class="compose-dialog" aria-labelledby="compose-title">
      <form class="compose-form" data-compose-form>
        <div class="dialog-heading">
          <h2 id="compose-title">Write a post</h2>
          <button class="dialog-close" type="button" data-close-compose>Close</button>
        </div>
        <label class="sr-only" for="compose-text">Your post</label>
        <textarea id="compose-text" maxlength="500" required placeholder="What's happening on campus?"></textarea>
        <button class="write-button" type="submit">Post</button>
      </form>
    </dialog>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a href="#feed" aria-current="page">Howl</a>
      <button type="button" data-open-compose>Write</button>
    </nav>
  </body>
</html>
